name: API CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# Only keep the newest run per ref alive; cancel superseded runs so queued
# pushes/PR updates don't pile up and starve the runner pool.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this pipeline only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung step (npm registry stall, deadlocked test) fails
    # fast instead of burning the full 6h default.
    timeout-minutes: 20

    env:
      CI: 'true'
      NODE_ENV: test
      # Wired to the postgres service below; integration tests that look for
      # DATABASE_URL will now actually exercise the DB instead of self-skipping.
      DATABASE_URL: postgres://postgres:password@localhost:5432/stellarsettle_test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: stellarsettle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stellarsettle_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 5

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci --runInBand
        timeout-minutes: 10
